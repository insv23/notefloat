<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notefloat</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar">
        <div class="sidebar-head">
          <button id="toggle-sidebar" class="icon" title="Toggle Sidebar" aria-label="Toggle Sidebar">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <rect x="1.9" y="3.2" width="12.2" height="9.6" rx="1.9" />
              <path d="M6.4 3.2v9.6" />
            </svg>
          </button>
          <div class="sidebar-actions">
            <button id="new-folder" class="icon" title="New Folder" aria-label="New Folder">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M13 20H8C5.17157 20 3.75736 20 2.87868 19.1213C2 18.2426 2 16.8284 2 14V8.49183C2 6.15409 2 4.98521 2.61604 4.17881C2.7778 3.96706 2.96706 3.7778 3.17881 3.61604C3.98521 3 5.15409 3 7.49183 3C8.16633 3 8.50358 3 8.81392 3.10442C8.8976 3.13257 8.97932 3.16623 9.05854 3.20518C9.35239 3.34965 9.59179 3.58719 10.0706 4.06227L10.8483 4.83389C11.4254 5.4066 11.714 5.69295 12.08 5.8437C12.446 5.99446 12.8525 5.99446 13.6656 5.99446H16C18.8284 5.99446 20.2426 5.99446 21.1213 6.87314C22 7.75182 22 9.16603 22 11.9945V12.5" />
                <path d="M19 15V21M22 18H16" />
              </svg>
            </button>
            <button id="new-note" class="icon" title="New Note" aria-label="New Note">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 3.5v9M3.5 8h9" />
              </svg>
            </button>
          </div>
        </div>
        <div class="sidebar-launch">
          <button id="open-search" class="search-launch" type="button" aria-label="Search All Notes">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="6.8" cy="6.8" r="4.2" />
              <path d="M10 10 13.5 13.5" />
            </svg>
            <span class="search-launch-label">Search</span>
            <span class="search-launch-key" id="open-search-key"></span>
          </button>
        </div>
        <div class="sidebar-scroll">
          <section class="group" id="pinned-section">
            <h2 class="group-title">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 21L8 16" />
                <path d="M13.2585 18.8714C9.51516 18.0215 5.97844 14.4848 5.12853 10.7415C4.99399 10.1489 4.92672 9.85266 5.12161 9.37197C5.3165 8.89129 5.55457 8.74255 6.03071 8.44509C7.10705 7.77265 8.27254 7.55888 9.48209 7.66586C11.1793 7.81598 12.0279 7.89104 12.4512 7.67048C12.8746 7.44991 13.1622 6.93417 13.7376 5.90269L14.4664 4.59604C14.9465 3.73528 15.1866 3.3049 15.7513 3.10202C16.316 2.89913 16.6558 3.02199 17.3355 3.26771C18.9249 3.84236 20.1576 5.07505 20.7323 6.66449C20.978 7.34417 21.1009 7.68401 20.898 8.2487C20.6951 8.8134 20.2647 9.05346 19.4039 9.53358L18.0672 10.2792C17.0376 10.8534 16.5229 11.1406 16.3024 11.568C16.0819 11.9955 16.162 12.8256 16.3221 14.4859C16.4399 15.7068 16.2369 16.88 15.5555 17.9697C15.2577 18.4458 15.1088 18.6839 14.6283 18.8786C14.1477 19.0733 13.8513 19.006 13.2585 18.8714Z" />
              </svg>
              Pinned
            </h2>
            <ul class="buffers" id="pinned"></ul>
          </section>
          <div class="sidebar-rule" role="separator"></div>
          <ul class="folders" id="folders"></ul>
        </div>
        <div class="sidebar-foot">
          <button id="open-settings" class="icon" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2 5.5h4M9.5 5.5h4.5M2 10.5h3.5M8.5 10.5h5.5" />
              <circle cx="8" cy="5.5" r="1.6" />
              <circle cx="7" cy="10.5" r="1.6" />
            </svg>
          </button>
        </div>
      </aside>
      <div class="sidebar-resizer" id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize Sidebar"></div>
      <main class="main">
        <header class="titlebar">
          <button id="show-sidebar" class="icon" title="Show Sidebar" aria-label="Show Sidebar">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <rect x="1.9" y="3.2" width="12.2" height="9.6" rx="1.9" />
              <path d="M6.4 3.2v9.6" />
            </svg>
          </button>
          <input id="title" class="title" spellcheck="false" autocomplete="off" />
          <span class="status" id="status"></span>
          <button id="block-filter" class="icon" title="Show Unfinished Blocks" aria-label="Filter Blocks" aria-pressed="false">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2.5 3.6h11l-4.2 5.1v4.3l-2.6 1.4V8.7z" />
            </svg>
          </button>
        </header>
        <div class="findbar" id="findbar" hidden></div>
        <div class="editor" id="editor"></div>
      </main>
      <div id="search-dialog"></div>
      <div id="settings"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
